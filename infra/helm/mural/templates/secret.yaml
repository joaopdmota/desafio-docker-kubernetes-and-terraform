{{- $password := required "postgres.password must be supplied" .Values.postgres.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.fullname" . }}-database
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user $password (include "mural.fullname" .) .Values.postgres.database | quote }}

