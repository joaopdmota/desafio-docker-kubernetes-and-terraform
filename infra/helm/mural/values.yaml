nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 1
  image: { repository: mural-api, tag: local, pullPolicy: IfNotPresent }
  port: 8080
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 30
  scaleDownStabilizationSeconds: 60

web:
  replicaCount: 1
  image: { repository: mural-web, tag: local, pullPolicy: IfNotPresent }
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

postgres:
  image: { repository: postgres, tag: 16-alpine, pullPolicy: IfNotPresent }
  user: mural
  database: mural
  password: "" # Required; inject with --set or Terraform set_sensitive.
  storage: 1Gi
  storageClassName: standard
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

migration:
  image: { repository: postgres, tag: 16-alpine, pullPolicy: IfNotPresent }
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

ingress:
  enabled: true
  className: traefik
  host: mural.localtest.me

