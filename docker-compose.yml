services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mural, POSTGRES_PASSWORD: mural-local, POSTGRES_DB: mural }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mural -d mural"], interval: 3s, timeout: 3s, retries: 20 }
    volumes: [postgres-data:/var/lib/postgresql/data]
  migrate:
    image: postgres:16-alpine
    depends_on: { db: { condition: service_healthy } }
    environment: { PGPASSWORD: mural-local }
    volumes: ["./app/api/migrations:/migrations:ro"]
    command: ["sh", "-ec", "for f in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h db -U mural -d mural -f \"$$f\"; done"]
    restart: "no"
  api:
    image: golang:1.23-alpine
    working_dir: /app
    volumes: ["./app/api:/app"]
    environment: { DATABASE_URL: "postgres://mural:mural-local@db:5432/mural?sslmode=disable", PORT: "8080" }
    command: ["go", "run", "."]
    depends_on: { db: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
  web:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./app/web:/usr/share/nginx/html:ro", "./app/web/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro"]
    environment: { API_UPSTREAM: "api:8080" }
    depends_on: { api: { condition: service_started } }
volumes: { postgres-data: {} }
